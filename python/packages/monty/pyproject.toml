[project]
name = "spark-core-monty"
description = "Monty CodeAct integrations for Spark Core."
authors = [{ name = "Microsoft", email = "af-support@microsoft.com"}]
readme = "README.md"
requires-python = ">=3.10"
version = "1.0.0b260721"
license-files = ["LICENSE"]
urls.homepage = "https://aka.ms/spark-core"
urls.source = "https://github.com/microsoft/spark-core/tree/main/python"
urls.release_notes = "https://github.com/microsoft/spark-core/releases?q=tag%3Apython-1&expanded=true"
urls.issues = "https://github.com/microsoft/spark-core/issues"
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
    "spark-core-core>=1.11.0,<2",
    "pydantic-monty>=0.0.1,<0.1",
]

[tool.uv]
prerelease = "if-necessary-or-explicit"
environments = [
    "sys_platform == 'darwin'",
    "sys_platform == 'linux'",
    "sys_platform == 'win32'"
]

[tool.uv-dynamic-versioning]
fallback-version = "0.0.0"

[tool.pytest.ini_options]
testpaths = 'tests'
addopts = "-ra -q -r fEX"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = []
timeout = 120
markers = [
    "integration: marks tests as integration tests that require external services",
]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "INP", "TD", "commented-out-code", "RUF", "S"]

[tool.coverage.run]
omit = [
    "**/__init__.py"
]

[tool.pyright]
extends = "../../pyproject.toml"
include = ["spark_core_monty"]
exclude = ['tests']

[tool.mypy]
plugins = ['pydantic.mypy']
strict = true
python_version = "3.10"
ignore_missing_imports = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
warn_return_any = true
show_error_codes = true
warn_unused_ignores = false
disallow_incomplete_defs = true
disallow_untyped_decorators = true

[tool.bandit]
targets = ["spark_core_monty"]
exclude_dirs = ["tests"]

[tool.poe]
executor.type = "uv"
include = "../../shared_tasks.toml"

[tool.poe.tasks.mypy]
help = "Run MyPy for this package."
cmd = "mypy --config-file $POE_ROOT/pyproject.toml spark_core_monty"

[tool.poe.tasks.test]
help = "Run the default unit test suite for this package."
cmd = 'pytest -m "not integration" --cov=spark_core_monty --cov-report=term-missing:skip-covered tests'

[tool.poe.tasks.test-integration]
help = "Run integration tests for this package (requires pydantic-monty)."
cmd = 'pytest -m "integration" tests'

[tool.flit.module]
name = "spark_core_monty"

[build-system]
requires = ["flit-core>=4.0.2,<5.0"]
build-backend = "flit_core.buildapi"
